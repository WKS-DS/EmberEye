[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embereye"
version = "0.0.1"
description = "Drone-agnostic aerial thermal situational awareness for wildland fire response."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Listed explicitly, so a ruff upgrade can't switch on new rules unnoticed:
# pyflakes (F) and pycodestyle's error checks (E4, E7, E9), whitespace (W),
# and import sorting (I): stdlib, third-party, local, a blank line between.
select = ["E4", "E7", "E9", "F", "W", "I"]
